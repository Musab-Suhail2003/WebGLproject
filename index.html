<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charizard's Chase – Save the Magikarp!</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: monospace; }
        canvas { display: block; }
        #loading {
            position: absolute;
            inset: 0;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 100;
        }
        #loading h2 {
            color: white;
            font-size: 1.8em;
            margin: 0;
            letter-spacing: 3px;
        }
        #loading p { color: #aaa; margin: 0; font-size: 0.9em; }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.15);
            border-top-color: #ff8c00;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 8px;
            border-radius: 4px;
            pointer-events: none;
        }
        #msg {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 2em;
            pointer-events: none;
        }
        #cutscene-title {
            position: absolute;
            top: 50%;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 2.4em;
            font-weight: bold;
            text-shadow: 0 0 12px rgba(0,0,0,0.9);
            transform: translateY(-50%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        #fade {
            position: absolute;
            inset: 0;
            background: black;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }
        #pause-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.72);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }
        #pause-overlay h1 {
            color: white;
            font-size: 3em;
            margin: 0 0 10px;
            letter-spacing: 4px;
        }
        .pause-btn {
            width: 200px;
            padding: 12px 0;
            font-size: 1.2em;
            font-family: monospace;
            font-weight: bold;
            border: 2px solid white;
            border-radius: 6px;
            background: rgba(255,255,255,0.1);
            color: white;
            cursor: pointer;
            transition: background 0.15s;
        }
        .pause-btn:hover { background: rgba(255,255,255,0.25); }
        /* ── Hearts ── */
        .heart { font-size: 1.4em; letter-spacing: 1px; }
        .heart-full  { color: #e02020; }
        .heart-half  {
            background: linear-gradient(to right, #e02020 50%, #444 50%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .heart-empty { color: #444; }
        /* ── Golbat compass ── */
        #compass-ring {
            position: absolute;
            top: calc(50% - 120px);
            left: 50%;
            transform: translateX(-50%);
            transform-origin: 50% 120px;
            pointer-events: none;
            color: #cc44ff;
            font-size: 1.6em;
            text-shadow: 0 0 8px #9900ff, 0 0 18px #9900ff;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <h2>CHARIZARD'S CHASE</h2>
        <p>Loading assets…</p>
    </div>
    <div id="compass-ring" style="display:none">▲</div>
    <div id="hud">
        <div id="hearts" style="margin-bottom:4px;"></div>
        Speed: <span id="speed">0.00</span><br>
        Altitude: <span id="altitude">3.00</span><br>
        <div style="margin-top:6px; font-size:0.85em;">
            BOOST <span id="boost-pct">0%</span>
            &nbsp;[<span style="color:#0af">SHIFT</span>]
            <span id="boost-ready" style="color:#0f0; display:none;"> ✓</span>
        </div>
        <div style="margin-top:3px; width:120px; height:10px;
                    background:rgba(255,255,255,0.2); border-radius:5px; overflow:hidden;">
            <div id="boost-bar"
                 style="height:100%; width:0%; background:#00ccff;
                        border-radius:5px; transition:width 0.1s;"></div>
        </div>
        <div style="margin-top:4px; font-size:0.75em; color:#FFD700;">
            ● Collect coins to use boost
        </div>
    </div>
    <div id="msg"></div>
    <div id="cutscene-title"></div>
    <div id="fade"></div>
    <div id="pause-overlay">
        <h1 id="pause-title">⏸ PAUSED</h1>
        <button class="pause-btn" id="btn-resume">▶ Resume</button>
        <button class="pause-btn" id="btn-retry">↺ Play Again</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="js/game.js"></script>
</body>
</html>
