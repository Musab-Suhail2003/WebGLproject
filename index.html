<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charizard's Chase – Save the Magikarp!</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: monospace; }
        canvas { display: block; }
        #loading {
            position: absolute;
            inset: 0;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 100;
        }
        #loading h2 {
            color: white;
            font-size: 1.8em;
            margin: 0;
            letter-spacing: 3px;
        }
        #loading p { color: #aaa; margin: 0; font-size: 0.9em; }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.15);
            border-top-color: #ff8c00;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 8px;
            border-radius: 4px;
            pointer-events: none;
        }
        #msg {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 2em;
            pointer-events: none;
        }
        #cutscene-title {
            position: absolute;
            bottom: 28px;
            left: 20px;
            max-width: 360px;
            background: rgba(0,0,0,0.65);
            color: white;
            font-size: 1em;
            font-weight: bold;
            padding: 10px 16px;
            border-left: 3px solid #ff8c00;
            border-radius: 4px;
            pointer-events: none;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }
        #cutscene-title.visible {
            opacity: 1;
            transform: translateY(0);
        }
        #fade {
            position: absolute;
            inset: 0;
            background: black;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }
        #pause-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.72);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }
        #pause-overlay h1 {
            color: white;
            font-size: 3em;
            margin: 0 0 10px;
            letter-spacing: 4px;
        }
        .pause-btn {
            width: 200px;
            padding: 12px 0;
            font-size: 1.2em;
            font-family: monospace;
            font-weight: bold;
            border: 2px solid white;
            border-radius: 6px;
            background: rgba(255,255,255,0.1);
            color: white;
            cursor: pointer;
            transition: background 0.15s;
        }
        .pause-btn:hover { background: rgba(255,255,255,0.25); }
        /* ── Hearts ── */
        .heart { font-size: 1.4em; letter-spacing: 1px; }
        .heart-full  { color: #e02020; }
        .heart-half  {
            background: linear-gradient(to right, #e02020 50%, #444 50%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .heart-empty { color: #444; }
        /* ── Catch mini-game overlay ── */
        #catch-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(5, 0, 20, 0.82);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        .catch-card {
            background: rgba(10, 5, 30, 0.96);
            border: 2px solid #ff8c00;
            border-radius: 10px;
            padding: 14px 22px;
            text-align: center;
            min-width: 280px;
            max-width: 340px;
            box-shadow: 0 0 28px rgba(255,140,0,0.22);
        }
        #catch-title {
            color: #ff8c00;
            font-size: 1.1em;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }
        #catch-sub {
            color: #bbb;
            font-size: 0.75em;
            margin-bottom: 12px;
        }
        #catch-sub kbd {
            background: rgba(255,255,255,0.15);
            border: 1px solid #666;
            border-radius: 3px;
            padding: 0px 4px;
            color: #fff;
            font-family: monospace;
        }
        .catch-bar-outer {
            position: relative;
            width: 100%;
            height: 26px;
            background: #111122;
            border-radius: 13px;
            overflow: hidden;
            margin-bottom: 10px;
            border: 1px solid #333;
        }
        #catch-zone {
            position: absolute;
            top: 0; bottom: 0;
            background: rgba(0, 200, 70, 0.30);
            border-left: 2px solid #00cc55;
            border-right: 2px solid #00cc55;
        }
        #catch-indicator {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 0.95em;
            text-shadow: 0 0 6px #fff, 0 0 14px #ffcc00;
            pointer-events: none;
        }
        #catch-result {
            font-size: 0.9em;
            font-weight: bold;
            min-height: 1.2em;
            letter-spacing: 1px;
        }
        /* ── Golbat compass ── */
        #compass-ring {
            position: absolute;
            top: calc(50% - 120px);
            left: 50%;
            transform: translateX(-50%);
            transform-origin: 50% 120px;
            pointer-events: none;
            color: #ba5027;
            font-size: 1.6em;
            text-shadow: 0 0 8px #ba5027, 0 0 18px #ba5027;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <h2>CHARIZARD'S CHASE</h2>
        <p>Loading assets…</p>
    </div>
    <div id="compass-ring" style="display:none">▲</div>
    <div id="hud">
        <div id="hearts" style="margin-bottom:4px;"></div>
        Speed: <span id="speed">0.00</span><br>
        Altitude: <span id="altitude">3.00</span><br>
        <div style="margin-top:6px; font-size:0.85em;">
            BOOST <span id="boost-pct">0%</span>
            &nbsp;[<span style="color:#0af">SHIFT</span>]
            <span id="boost-ready" style="color:#0f0; display:none;"> ✓</span>
        </div>
        <div style="margin-top:3px; width:120px; height:10px;
                    background:rgba(255,255,255,0.2); border-radius:5px; overflow:hidden;">
            <div id="boost-bar"
                 style="height:100%; width:0%; background:#00ccff;
                        border-radius:5px; transition:width 0.1s;"></div>
        </div>
        <div style="margin-top:4px; font-size:0.75em; color:#FFD700;">
            ● Collect coins to use boost
        </div>
    </div>
    <div id="msg"></div>
    <div id="cutscene-title"></div>
    <div id="fade"></div>
    <div id="catch-overlay">
        <div class="catch-card">
            <div id="catch-title">🦇 GOLBAT IN RANGE!</div>
            <div id="catch-sub">Press <kbd>SPACE</kbd> when the indicator hits the green zone</div>
            <div class="catch-bar-outer">
                <div id="catch-zone"></div>
                <div id="catch-indicator">◆</div>
            </div>
            <div id="catch-result"></div>
        </div>
    </div>
    <div id="pause-overlay">
        <h1 id="pause-title">⏸ PAUSED</h1>
        <button class="pause-btn" id="btn-resume">▶ Resume</button>
        <button class="pause-btn" id="btn-retry">↺ Play Again</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="js/game.js"></script>
</body>
</html>
